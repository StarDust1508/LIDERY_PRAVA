# Непрерывная проверка платформы «Лидеры права» (ТЗ 11, п. 8.2–8.3).
#
# Перед каждым выпуском требуется: tsc --noEmit, тесты, гейты разделения,
# проверка миграций на пустой БД и npm audit. Здесь это выполняется на каждый
# push в рабочую ветку и на каждый pull request.
#
# Ветка main защищена правилами репозитория: изменения приходят только слиянием
# проверенной ветки (ТЗ 11, п. 8.4) — настройка выполняется в интерфейсе GitHub.

name: Проверка

on:
  push:
    branches: [main, feature/lidery-prava-platform]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Типы, тесты, гейты, зависимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Зависимости
        run: |
          npm --prefix platform/server ci --include=dev --no-audit --no-fund
          npm --prefix platform/shared ci --include=dev --no-audit --no-fund
          npm --prefix platform/web ci --include=dev --no-audit --no-fund
          npm --prefix platform/admin ci --include=dev --no-audit --no-fund

      - name: Типы (сервер)
        run: npx tsc --noEmit
        working-directory: platform/server

      - name: Типы (публичная часть и кабинет)
        run: npx tsc --noEmit
        working-directory: platform/web

      - name: Типы (админка)
        run: npx tsc --noEmit
        working-directory: platform/admin

      - name: Типы (общий модуль)
        run: npx tsc --noEmit
        working-directory: platform/shared

      - name: Тесты
        run: |
          npm test
          npm --prefix ../shared test
        working-directory: platform/server

      - name: Гейты разделения (ТЗ 03)
        run: bash platform/scripts/check-decoupling.sh

      - name: Уязвимости зависимостей (критические блокируют выпуск)
        run: |
          npm audit --audit-level=critical
          npm --prefix ../shared audit --audit-level=critical
        working-directory: platform/server

      - name: Уязвимости зависимостей (интерфейсы)
        run: |
          npm audit --audit-level=critical
        working-directory: platform/web

  acceptance:
    name: Приёмка (С1–С10) на чистой базе
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liders
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: liders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liders"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: liders
      PGPASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Файл окружения для прогона
        run: |
          {
            echo 'NODE_ENV=test'
            echo 'API_HOST=127.0.0.1'
            echo 'API_PORT=3005'
            echo 'DATABASE_HOST=127.0.0.1'
            echo 'DATABASE_PORT=5432'
            echo 'DATABASE_NAME=liders'
            echo 'DATABASE_USER=liders'
            echo 'DATABASE_PASSWORD=ci-password'
            echo 'DATABASE_SCHEMA=liders'
            echo 'JWT_SECRET=ci-jwt-secret-not-shorter-than-32-symbols'
            echo 'ADMIN_SESSION_SECRET=ci-admin-session-secret-32-symbols-min'
            echo 'ADMIN_LOGIN=admin'
            echo 'ADMIN_PASSWORD=ci-admin-password'
            echo 'PUBLIC_BASE_URL=http://127.0.0.1:3005'
            echo 'CORS_ORIGINS=http://127.0.0.1:3005'
            echo 'MEDIA_GRANT_TTL_SECONDS=900'
            echo 'ADMIN_LOGIN_FAIL_MAX=4'
            echo 'ADMIN_LOGIN_BLOCK_MINUTES=1'
          } > platform/.env
          chmod 600 platform/.env

      - name: Зависимости
        run: |
          npm --prefix platform/server ci --include=dev --no-audit --no-fund
          npm --prefix platform/shared ci --include=dev --no-audit --no-fund

      - name: Приёмочный прогон
        run: bash platform/scripts/acceptance.sh
