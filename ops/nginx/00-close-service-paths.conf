# ЗАКРЫТИЕ ПУБЛИЧНОГО ДОСТУПА К СЛУЖЕБНЫМ ФАЙЛАМ
# ---------------------------------------------------------------
# Причина: nginx отдаёт статику из корня сайта, где лежат код и БД.
# Следствие: по HTTP скачиваются /data/applications.db (персональные данные),
# /data/applications.db-wal, /data/auth.log, /server.py, /scripts/*.
#
# ВСТАВИТЬ ЭТОТ БЛОК ВНУТРЬ server { } ДЛЯ 443 (listen 443 ssl http2)
# ДО блоков "location /" и "location ~* \.(...)$".
#
# Внимание: если позднее понадобится отдавать легальные архивы (.zip/.gz),
# их нужно разместить в отдельном каталоге и разрешить явным location,
# например:  location /files/ { ... }  — а не ослаблять правила ниже.

# Каталоги со служебными данными
location ~ ^/(data|scripts|private|backup|backups|\.git)/ {
    return 404;
}

# Служебные файлы по расширению
location ~* \.(py|db|db-wal|db-shm|sqlite|sqlite3|log|env|bak|sql|dump|ini|conf)$ {
    return 404;
}

# Точечно — исполняемые и установочные скрипты в корне
location ~ ^/(server\.py|deploy\.sh|setup_server\.sh|start_server\.sh|run_server\.sh|run_certbot\.sh|install_certbot\.sh|check_server\.sh|server_check\.sh|upload_configs\.sh|mkdir\.sh)$ {
    return 404;
}

# Скрытые файлы и каталоги (.env, .git, .DS_Store и подобные)
location ~ /\.(?!well-known) {
    return 404;
}
