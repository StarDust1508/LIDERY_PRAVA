# Целевая конфигурация nginx для платформы «Лидеры права»
# ---------------------------------------------------------------
# Отличия от текущей:
#   1. корень сайта — только статика сборки (/var/www/lideryprava/public);
#   2. API — отдельный локальный процесс liders-api на 127.0.0.1:8091;
#   3. служебные каталоги и файлы недоступны по HTTP;
#   4. несуществующий путь отдаёт 404, а не главную страницу;
#   5. лимит тела запроса 30 МБ (конкурсные материалы).

server {
    listen 80;
    listen [::]:80;
    server_name lideryprava.ru www.lideryprava.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lideryprava.ru www.lideryprava.ru;

    ssl_certificate     /etc/letsencrypt/live/lideryprava.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lideryprava.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Корень — только публичная сборка. Никакого кода, БД и журналов.
    root /var/www/lideryprava/public;
    index index.html;

    client_max_body_size 30m;
    client_body_timeout 60s;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Frame-Options "DENY" always;
    # Content-Security-Policy для статики (ТЗ 11, п. 5.1). Express ставит
    # политику только на /api, а страницы сайта отдаёт nginx — без этого
    # заголовка HTML оставался без CSP.
    #   • script-src без 'unsafe-inline': встроенных исполняемых скриптов в
    #     сборке нет (JSON-LD — блок данных, CSP его не ограничивает);
    #   • style-src с 'unsafe-inline' — React ставит часть стилей атрибутами;
    #   • frame-ancestors 'none' согласовано с X-Frame-Options: DENY.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https://vk.com https://vk.ru https://rutube.ru; frame-src 'self' https://vk.com https://vk.ru https://rutube.ru; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Служебные пути: закрыты всегда -------------------------------------
    location ~ ^/(data|scripts|private|backup|backups|\.git)/ { return 404; }
    location ~* \.(py|db|db-wal|db-shm|sqlite|sqlite3|log|env|bak|sql|dump|ini|conf)$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;   # потоковая загрузка файлов
    }

    # --- Админка (отдельная сборка, не индексируется) ------------------------
    location /admin/ {
        alias /var/www/lideryprava/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /admin { return 301 /admin/; }

    # --- Долгоживущие ассеты сборки -----------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Файлы верификации Mail.ru и подобные — отдаются всегда
    location ~ ^/mailru-domain.*\.html$ {
        try_files $uri =404;
        access_log off;
    }

    location = /favicon.ico { try_files $uri =404; access_log off; expires 7d; }
    location = /robots.txt  { try_files $uri =404; access_log off; }

    # Карта сайта собирается из базы: архив законопроектов, победители по годам и
    # действующие редакции документов меняются без правки статики.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- Сохранение прежних адресов (ТЗ 10, С7) ------------------------------
    # Старые страницы продолжают работать через постоянные редиректы: ссылки из
    # поиска и внешних источников не должны ломаться.
    location = /index.html     { return 301 /; }
    location = /pobediteli.html { return 301 /winners; }
    location = /privacy.html    { return 301 /legal/privacy; }
    location = /soglasie.html   { return 301 /legal/pdn-consent; }
    location = /terms.html      { return 301 /legal/terms; }
    location = /cookies.html    { return 301 /legal/cookies; }
    location = /admin.html      { return 301 /admin/; }

    # --- Карточки с данными из базы ------------------------------------------
    # Список и разделы собраны статикой при сборке (scripts/prerender.mjs), а
    # карточки (инициатива, публикация, мастер-класс, победители года, документ)
    # отдаются оболочкой приложения: их содержимое берётся из API. Адрес
    # проверяется по форме, чтобы «/news/что-попало» не выглядело страницей.
    location ~ ^/(initiatives|news|masterclasses)/[A-Za-z0-9._-]+$ {
        try_files /index.html =404;
    }
    # Фигурные скобки в шаблоне требуют кавычек: без них nginx принимает их за
    # начало блока и отказывается читать конфигурацию.
    location ~ "^/winners/[0-9]{4}$" {
        try_files /index.html =404;
    }

    # Юридические документы: перечень закрытый (ТЗ 08, п. 2.1 и ТЗ 09), поэтому
    # неизвестный документ получает честный 404, а не пустую страницу.
    location ~ ^/legal/(offer|privacy|terms|cookies|jury-regulations|mailing-consent|pdn-consent|pdn-consent-minor|distribution-consent|media-license|appendix/[0-9]+)$ {
        try_files /index.html =404;
    }
    # Префикс без «^~»: иначе он перекрыл бы проверки выше и закрыл бы
    # существующие документы. Здесь оказываются только неизвестные адреса.
    location /legal/ { return 404; }

    # Личный кабинет: одна оболочка на все разделы, данные приходят с API.
    location ~ ^/cabinet(/|$) {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # --- PDF Положения и приложений ------------------------------------------
    location /docs/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Публичные страницы: только реально существующие пути ----------------
    # Неизвестный путь честно отдаёт 404, а не главную страницу.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    access_log /var/log/nginx/lideryprava.access.log;
    error_log  /var/log/nginx/lideryprava.error.log warn;
}
